name: okey_master
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  
  # OkeyMaster Proje Bağımlılıkları
  flutter_riverpod: ^3.3.1
  shared_preferences: ^2.2.0
  firebase_core: ^4.7.0
  firebase_analytics: ^12.3.0
  firebase_auth: ^6.4.0
  google_mobile_ads: ^8.0.0
  audioplayers: ^6.6.0
  uuid: ^4.2.0
  http: ^1.1.0
  connectivity_plus: ^7.1.1

  cupertino_icons: ^1.0.8
  equatable: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Daha sonra Kişi 2'nin ekleyeceği klasörler şimdiden tanımlı
  assets:
    - assets/images/tiles/
    - assets/images/ui/
    - assets/sounds/
